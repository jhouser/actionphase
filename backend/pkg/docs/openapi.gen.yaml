            tags:
                - Exports
    /games:
        get:
            description: 'The main game listing, with filtering, sorting and pagination. Authentication is optional: a signed-in caller also gets their relationship to each game.'
            operationId: listGames
            parameters:
                - explode: false
                  in: query
                  name: search
                  schema:
                    type: string
                - description: Comma-separated game states
                  explode: false
                  in: query
                  name: states
                  schema:
                    description: Comma-separated game states
                    type: string
                - explode: false
                  in: query
                  name: participation
                  schema:
                    type: string
                - description: '"true" or "false"; anything else is ignored'
                  explode: false
                  in: query
                  name: has_open_spots
                  schema:
                    description: '"true" or "false"; anything else is ignored'
                    type: string
                - explode: false
                  in: query
                  name: sort_by
                  schema:
                    type: string
                - description: '"true" enables admin mode for an authenticated admin'
                  explode: false
                  in: query
                  name: admin_mode
                  schema:
                    description: '"true" enables admin mode for an authenticated admin'
                    type: string
                - description: 1-based page number; defaults to 1
                  explode: false
                  in: query
                  name: page
                  schema:
                    description: 1-based page number; defaults to 1
                    type: string
                - description: 1-100; defaults to 20
                  explode: false
                  in: query
                  name: page_size
                  schema:
                    description: 1-100; defaults to 20
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GameListingResponse'
                    description: OK
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LegacyError'
                    description: Error
            summary: List games
            tags:
                - Games
