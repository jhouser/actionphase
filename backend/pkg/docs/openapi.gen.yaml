components:
    schemas:
        ActionResponse:
            additionalProperties: false
            properties:
                character_id:
                    format: int32
                    type: integer
                content:
                    type: string
                game_id:
                    format: int32
                    type: integer
                id:
                    format: int32
                    type: integer
                phase_id:
                    format: int32
                    type: integer
                submitted_at:
                    format: date-time
                    type: string
                updated_at:
                    format: date-time
                    type: string
                user_id:
                    format: int32
                    type: integer
            required:
                - id
                - game_id
                - user_id
                - phase_id
                - content
                - submitted_at
                - updated_at
            type: object
        ActionResultResponse:
            additionalProperties: false
            properties:
                content:
                    type: string
                game_id:
                    format: int32
                    type: integer
                gm_user_id:
                    format: int32
                    type: integer
                id:
                    format: int32
                    type: integer
                is_published:
                    type: boolean
                phase_id:
                    format: int32
                    type: integer
                sent_at:
                    format: date-time
                    type: string
                user_id:
                    format: int32
                    type: integer
            required:
                - id
                - game_id
                - user_id
                - phase_id
                - gm_user_id
                - content
                - is_published
            type: object
        ActionResultWithDetailsResponse:
            additionalProperties: false
            properties:
                action_submission_id:
                    format: int32
                    type: integer
                character_id:
                    format: int32
                    type: integer
                character_name:
                    type: string
                content:
                    type: string
                game_id:
                    format: int32
                    type: integer
                gm_user_id:
                    format: int32
                    type: integer
                gm_username:
                    type: string
                id:
                    format: int32
                    type: integer
                is_published:
                    type: boolean
                parent_result_id:
                    format: int32
                    type: integer
                part_count:
                    format: int32
                    type: integer
                part_number:
                    format: int32
                    type: integer
                phase_id:
                    format: int32
                    type: integer
                phase_number:
                    format: int32
                    type: integer
                phase_type:
                    type: string
                released_at:
                    format: date-time
                    type: string
                reveal_delay_minutes:
                    format: int32
                    type: integer
                sent_at:
                    format: date-time
                    type: string
                unlocks_at:
                    format: date-time
                    type: string
                user_id:
                    format: int32
                    type: integer
                username:
                    type: string
            required:
                - id
                - game_id
                - user_id
                - phase_id
                - gm_user_id
                - content
                - is_published
            type: object
        ActionSubmissionResponse:
            additionalProperties: false
            properties:
                character_id:
                    format: int32
                    type:
                        - integer
                        - "null"
                character_name:
                    type:
                        - string
                        - "null"
                content:
                    type: string
                game_id:
                    format: int32
                    type: integer
                id:
                    format: int32
                    type: integer
                phase_id:
                    format: int32
                    type: integer
                phase_number:
                    format: int32
                    type: integer
                phase_title:
                    type: string
                phase_type:
                    type: string
                submitted_at:
                    type:
                        - string
                        - "null"
                updated_at:
                    type:
                        - string
                        - "null"
                user_id:
                    format: int32
                    type: integer
                username:
                    type: string
            required:
                - id
                - game_id
                - user_id
                - phase_id
                - character_id
                - content
                - submitted_at
                - updated_at
                - username
                - character_name
                - phase_type
                - phase_number
                - phase_title
            type: object
        ActionSubmissionsOutputBody:
            additionalProperties: false
            properties:
                action_submissions:
                    items:
                        $ref: '#/components/schemas/ActionSubmissionResponse'
                    type:
                        - array
                        - "null"
                total:
                    format: int64
                    type: integer
            required:
                - action_submissions
                - total
            type: object
        ActionWithDetailsResponse:
            additionalProperties: false
            properties:
                character_id:
                    format: int32
                    type: integer
                character_name:
                    type: string
                content:
                    type: string
                game_id:
                    format: int32
                    type: integer
                id:
                    format: int32
                    type: integer
                phase_id:
                    format: int32
                    type: integer
                phase_number:
                    format: int32
                    type: integer
                phase_type:
                    type: string
                submitted_at:
                    format: date-time
                    type: string
                updated_at:
                    format: date-time
                    type: string
                user_id:
                    format: int32
                    type: integer
                username:
                    type: string
            required:
                - id
                - game_id
                - user_id
                - phase_id
                - content
                - submitted_at
                - updated_at
                - username
            type: object
        AddParticipantBody:
            additionalProperties: false
            properties:
                role:
                    enum:
                        - player
                        - audience
                    type: string
                user_id:
                    description: User to add
                    format: int32
                    minimum: 1
                    type: integer
            required:
                - user_id
                - role
            type: object
        AddParticipantRequest:
            additionalProperties: false
            properties:
                character_id:
                    format: int32
                    type: integer
            required:
                - character_id
            type: object
        AppendStagedPartBody:
            additionalProperties: false
            properties:
                content:
                    description: Part content
                    minLength: 1
                    type: string
                delay_minutes:
                    description: Minutes to wait after the previous part releases
                    format: int32
                    type: integer
            required:
                - content
                - delay_minutes
            type: object
        ApplyToGameBody:
            additionalProperties: false
            properties:
                message:
                    type: string
                role:
                    enum:
                        - player
                        - audience
                    type: string
            required:
                - role
            type: object
        ApproveCharacterRequest:
            additionalProperties: false
            properties:
                status:
                    description: Must be "approved"; there is no reject path
                    enum:
                        - approved
                    type: string
            required:
                - status
            type: object
        AssignNPCRequest:
            additionalProperties: false
            properties:
                assigned_user_id:
                    description: Audience member to control the NPC, or the GM to take it back
                    format: int32
                    minimum: 1
                    type: integer
            required:
                - assigned_user_id
            type: object
        AudienceMemberResponse:
            additionalProperties: false
            properties:
                game_id:
                    format: int32
                    type: integer
                id:
                    format: int32
                    type: integer
                joined_at:
                    format: date-time
                    type: string
                role:
                    type: string
                status:
                    type: string
                user_id:
                    format: int32
                    type: integer
                username:
                    type: string
            required:
                - id
                - game_id
                - user_id
                - username
                - role
                - status
                - joined_at
            type: object
        AudienceMessageResponse:
            additionalProperties: false
            properties:
                content:
                    type: string
                conversation_id:
                    format: int32
                    type: integer
                created_at:
                    type: string
                id:
                    format: int32
                    type: integer
                is_deleted:
                    type: boolean
                sender_character_id:
                    format: int32
                    type:
                        - integer
                        - "null"
                sender_character_name:
                    type:
                        - string
                        - "null"
                sender_user_id:
                    format: int32
                    type:
                        - integer
                        - "null"
                sender_username:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - conversation_id
                - sender_user_id
                - sender_character_id
                - content
                - created_at
                - updated_at
                - is_deleted
                - sender_username
                - sender_character_name
            type: object
        AudienceNPCsOutputBody:
            additionalProperties: false
            properties:
                npcs: {}
            required:
                - npcs
            type: object
        AutoAcceptAudienceBody:
            additionalProperties: false
            properties:
                auto_accept_audience:
                    type: boolean
            required:
                - auto_accept_audience
            type: object
        AvatarUploadResponse:
            additionalProperties: false
            properties:
                avatar_url:
                    description: Public URL of the stored avatar
                    type: string
            required:
                - avatar_url
            type: object
        BannedUser:
            additionalProperties: false
            properties:
                banned_at:
                    format: date-time
                    type: string
                banned_by_user_id:
                    format: int32
                    type: integer
                banned_by_username:
                    type: string
                created_at:
                    format: date-time
                    type: string
                email:
                    type: string
                id:
                    format: int64
                    type: integer
                username:
                    type: string
            required:
                - id
                - username
                - email
                - banned_at
                - banned_by_user_id
                - banned_by_username
                - created_at
            type: object
        BannerOutputBody:
            additionalProperties: false
            properties:
                banner_url:
                    type: string
            required:
                - banner_url
            type: object
        Bool:
            additionalProperties: false
            properties:
                Bool:
                    type: boolean
                Valid:
                    type: boolean
            required:
                - Bool
                - Valid
            type: object
        ChangeEmailRequest:
            additionalProperties: false
            properties:
                current_password:
                    type: string
                new_email:
                    type: string
            required:
                - new_email
                - current_password
            type: object
        ChangePasswordRequest:
            additionalProperties: false
            properties:
                confirm_password:
                    type: string
                current_password:
                    type: string
                new_password:
                    type: string
            required:
                - current_password
                - new_password
                - confirm_password
            type: object
        ChangeUsernameRequest:
            additionalProperties: false
            properties:
                current_password:
                    type: string
                new_username:
                    type: string
            required:
                - new_username
                - current_password
            type: object
        CharacterDataRequest:
            additionalProperties: false
            properties:
                field_name:
                    description: Field key within the module
                    minLength: 1
                    type: string
                field_type:
                    description: How field_value should be parsed
                    enum:
                        - text
                        - number
                        - boolean
                        - json
                    type: string
                field_value:
                    description: Value to store. Empty clears the field.
                    type: string
                is_public:
                    description: Whether non-editors may read this field
                    type: boolean
                module_type:
                    description: Sheet tab, e.g. bio, skills, inventory
                    minLength: 1
                    type: string
            required:
                - module_type
                - field_name
                - field_type
            type: object
        CharacterDataResponse:
            additionalProperties: false
            properties:
                character_id:
                    description: Character this field belongs to
                    format: int32
                    type: integer
                created_at:
                    format: date-time
                    type: string
                field_name:
                    description: Field key within the module
                    type: string
                field_type:
                    description: How field_value should be parsed
                    enum:
                        - text
                        - number
                        - boolean
                        - json
                    type:
                        - string
                        - "null"
                field_value:
                    description: Stored value, absent when NULL
                    type: string
                id:
                    description: Row ID
                    format: int32
                    type: integer
                is_public:
                    description: Whether non-editors may read this field
                    type: boolean
                module_type:
                    description: Sheet tab, e.g. bio, skills, inventory
                    type: string
                updated_at:
                    format: date-time
                    type: string
            required:
                - id
                - character_id
                - module_type
                - field_name
                - field_type
                - created_at
                - updated_at
            type: object
        CharacterMessageResponse:
            additionalProperties: false
            properties:
                author_id:
                    format: int32
                    type: integer
                author_username:
                    description: Blank in an anonymous game when the caller may not see it
                    type: string
                character_avatar_url:
                    type:
                        - string
                        - "null"
                character_id:
                    format: int32
                    type: integer
                character_name:
                    type:
                        - string
                        - "null"
                content:
                    description: Body, as markdown
                    type: string
                created_at:
                    description: RFC3339 timestamp
                    type: string
                deleted_at:
                    description: RFC3339 timestamp, null when not deleted
                    type:
                        - string
                        - "null"
                edit_count:
                    format: int32
                    type: integer
                edited_at:
                    description: RFC3339 timestamp, null when never edited
                    type:
                        - string
                        - "null"
                game_id:
                    format: int32
                    type: integer
                id:
                    description: Message ID
                    format: int32
                    type: integer
                is_deleted:
                    type: boolean
                message_type:
                    description: '"post" or "comment"'
                    type: string
                parent:
                    $ref: '#/components/schemas/ParentContextResponse'
                    description: The message being replied to, for comments
                parent_id:
                    description: Message being replied to, null for a post
                    format: int32
                    type:
                        - integer
                        - "null"
            required:
                - id
                - game_id
                - parent_id
                - author_id
                - character_id
                - content
                - message_type
                - created_at
                - edited_at
                - edit_count
                - deleted_at
                - is_deleted
                - author_username
                - character_name
                - character_avatar_url
            type: object
        CharacterMessagesResponse:
            additionalProperties: false
            properties:
                messages:
                    items:
                        $ref: '#/components/schemas/CharacterMessageResponse'
                    type:
                        - array
                        - "null"
                pagination:
                    $ref: '#/components/schemas/PaginationResponse'
            required:
                - messages
                - pagination
            type: object
        CharacterResponse:
            additionalProperties: false
            properties:
                avatar_url:
                    description: Character portrait URL
                    type: string
                character_type:
                    description: Absent when an anonymous game hides it from the caller
                    enum:
                        - player_character
                        - npc
                    type: string
                created_at:
                    format: date-time
                    type: string
                game_id:
                    description: Game the character belongs to
                    format: int32
                    type: integer
                id:
                    description: Character ID
                    format: int32
                    type: integer
                name:
                    description: Character name
                    type: string
                status:
                    description: Approval status
                    enum:
                        - pending
                        - approved
                    type: string
                updated_at:
                    format: date-time
                    type: string
                user_id:
                    description: Owning player, absent for unassigned NPCs
                    format: int32
                    type: integer
            required:
                - id
                - game_id
                - name
                - status
                - created_at
                - updated_at
            type: object
        CharacterSheetConfig:
            additionalProperties: false
            properties:
                labels:
                    $ref: '#/components/schemas/CharacterSheetLabels'
            type: object
        CharacterSheetLabels:
            additionalProperties: false
            properties:
                inventory:
                    type: string
                numbers:
                    type: string
                skills:
                    type: string
            type: object
        CharacterStatsResponse:
            additionalProperties: false
            properties:
                private_messages:
                    description: Omitted when the caller may not see it
                    format: int64
                    type: integer
                public_messages:
                    description: Messages visible to the whole game
                    format: int64
                    type: integer
            required:
                - public_messages
            type: object
        CommentSummaryResponse:
            additionalProperties: false
            properties:
                author_id:
                    description: User who wrote the comment
                    format: int32
                    type: integer
                author_username:
                    description: Blank in an anonymous game when the caller may not see it
                    type: string
                character_avatar_url:
                    description: Character portrait URL
                    type:
                        - string
                        - "null"
                character_id:
                    description: Character the comment is attributed to
                    format: int32
                    type: integer
                character_name:
                    description: Character's display name
                    type: string
                content:
                    description: Comment body, as markdown
                    type: string
                created_at:
                    format: date-time
                    type: string
                game_id:
                    description: Game this comment belongs to
                    format: int32
                    type: integer
                id:
                    description: Comment ID
                    format: int32
                    type: integer
                is_deleted:
                    type: boolean
                is_edited:
                    type: boolean
                mentioned_character_ids:
                    description: Characters @-mentioned in the body
                    items:
                        format: int32
                        type: integer
                    type:
                        - array
                        - "null"
                message_type:
                    description: Always "comment" for this endpoint
                    type: string
                parent_id:
                    description: Message being replied to
                    format: int32
                    type: integer
                phase_id:
                    description: Phase the comment belongs to
                    format: int32
                    type: integer
                reply_count:
                    description: Direct replies to this comment
                    format: int64
                    type: integer
                thread_depth:
                    description: Nesting level under the root post
                    format: int32
                    type: integer
            required:
                - id
                - game_id
                - author_id
                - character_id
                - content
                - message_type
                - thread_depth
                - author_username
                - character_name
                - character_avatar_url
                - reply_count
                - is_edited
                - is_deleted
                - mentioned_character_ids
                - created_at
            type: object
        CommentWithParentResponse:
            additionalProperties: false
            properties:
                author_id:
                    format: int32
                    type: integer
                author_username:
                    description: Blank in an anonymous game when the caller may not see it
                    type: string
                character_avatar_url:
                    type:
                        - string
                        - "null"
                character_id:
                    format: int32
                    type: integer
                character_name:
                    type:
                        - string
                        - "null"
                content:
                    description: Comment body, as markdown
                    type: string
                created_at:
                    description: RFC3339 timestamp
                    type: string
                deleted_at:
                    description: RFC3339 timestamp, null when not deleted
                    type:
                        - string
                        - "null"
                edit_count:
                    format: int32
                    type: integer
                edited_at:
                    description: RFC3339 timestamp, null when never edited
                    type:
                        - string
                        - "null"
                game_id:
                    format: int32
                    type: integer
                id:
                    description: Comment ID
                    format: int32
                    type: integer
                is_deleted:
                    type: boolean
                parent:
                    $ref: '#/components/schemas/ParentContextResponse'
                    description: The message being replied to
                parent_id:
                    description: Message being replied to
                    format: int32
                    type:
                        - integer
                        - "null"
                post_id:
                    description: Top-level post at the head of this thread
                    format: int32
                    type:
                        - integer
                        - "null"
            required:
                - id
                - game_id
                - parent_id
                - post_id
                - author_id
                - character_id
                - content
                - created_at
                - edited_at
                - edit_count
                - deleted_at
                - is_deleted
                - author_username
                - character_name
                - character_avatar_url
            type: object
        CommonRoomPoll:
            additionalProperties: false
            properties:
                allow_audience_voting:
                    type: boolean
                allow_other_option:
                    $ref: '#/components/schemas/Bool'
                created_at:
                    $ref: '#/components/schemas/Timestamptz'
                created_by_character_id:
                    $ref: '#/components/schemas/Int4'
                created_by_user_id:
                    format: int32
                    type: integer
                deadline:
                    $ref: '#/components/schemas/Timestamptz'
                description:
                    $ref: '#/components/schemas/Text'
                game_id:
                    format: int32
                    type: integer
                hide_results_from_players:
                    type: boolean
                id:
                    format: int32
                    type: integer
                is_deleted:
                    $ref: '#/components/schemas/Bool'
                phase_id:
                    $ref: '#/components/schemas/Int4'
                question:
                    type: string
                show_individual_votes:
                    $ref: '#/components/schemas/Bool'
                show_running_totals_to_players:
                    type: boolean
                updated_at:
                    $ref: '#/components/schemas/Timestamptz'
            required:
                - id
                - game_id
                - phase_id
                - created_by_user_id
                - created_by_character_id
                - question
                - description
                - deadline
                - show_individual_votes
                - allow_other_option
                - hide_results_from_players
                - allow_audience_voting
                - show_running_totals_to_players
                - is_deleted
                - created_at
                - updated_at
            type: object
        ControllableCharacterResponse:
            additionalProperties: false
            properties:
                avatar_url:
                    description: Character portrait URL
                    type: string
                character_type:
                    description: Character kind
                    enum:
                        - player_character
                        - npc
                    type: string
                created_at:
                    format: date-time
                    type: string
                game_id:
                    description: Game the character belongs to
                    format: int32
                    type: integer
                id:
                    description: Character ID
                    format: int32
                    type: integer
                name:
                    description: Character name
                    type: string
                status:
                    description: Approval status
                    enum:
                        - pending
                        - approved
                    type: string
                updated_at:
                    format: date-time
                    type: string
                user_id:
                    description: Owning player
                    format: int32
                    type: integer
            required:
                - id
                - game_id
                - name
                - character_type
                - created_at
                - updated_at
            type: object
        ControllableCharacterWithGameResponse:
            additionalProperties: false
            properties:
                assigned_username:
                    description: Username controlling this NPC
                    type: string
                avatar_url:
                    description: Character portrait URL
                    type: string
                character_type:
                    description: Character kind
                    enum:
                        - player_character
                        - npc
                    type: string
                created_at:
                    format: date-time
                    type: string
                game_character_sheet:
                    $ref: '#/components/schemas/CharacterSheetConfig'
                    description: That game's sheet label overrides, absent when it has none
                game_id:
                    description: Game the character belongs to
                    format: int32
                    type: integer
                game_is_anonymous:
                    description: Whether that game hides player identity
                    type: boolean
                game_portrait_avatars:
                    description: Whether that game renders avatars as portraits
                    type: boolean
                game_state:
                    description: That game's lifecycle state
                    type: string
                game_title:
                    description: Title of the game this character belongs to
                    type: string
                id:
                    description: Character ID
                    format: int32
                    type: integer
                name:
                    description: Character name
                    type: string
                status:
                    description: Approval status
                    enum:
                        - pending
                        - approved
                    type: string
                updated_at:
                    format: date-time
                    type: string
                user_id:
                    description: Owning player
                    format: int32
                    type: integer
                user_role:
                    description: The caller's role in that game
                    enum:
                        - gm
                        - co_gm
                        - player
                        - audience
                    type: string
                username:
                    description: Owning player's username
                    type: string
            required:
                - game_title
                - game_is_anonymous
                - game_portrait_avatars
                - user_role
                - id
                - game_id
                - name
                - character_type
                - created_at
                - updated_at
            type: object
        Conversation:
            additionalProperties: false
            properties:
                conversation_type:
                    type: string
                created_at:
                    $ref: '#/components/schemas/Timestamptz'
                created_by_user_id:
                    format: int32
                    type: integer
                game_id:
                    format: int32
                    type: integer
                id:
                    format: int32
                    type: integer
                title:
                    $ref: '#/components/schemas/Text'
                updated_at:
                    $ref: '#/components/schemas/Timestamptz'
            required:
                - id
                - game_id
                - conversation_type
                - title
                - created_by_user_id
                - created_at
                - updated_at
            type: object
        ConversationDetailOutputBody:
            additionalProperties: false
            properties:
                conversation:
                    $ref: '#/components/schemas/Conversation'
                participants:
                    items:
                        $ref: '#/components/schemas/GetConversationParticipantsRow'
                    type:
                        - array
                        - "null"
            required:
                - conversation
                - participants
            type: object
        ConversationMessagesOutputBody:
            additionalProperties: false
            properties:
                messages:
                    items:
                        $ref: '#/components/schemas/AudienceMessageResponse'
                    type:
                        - array
                        - "null"
            required:
                - messages
            type: object
        ConversationParticipantCharacter:
            additionalProperties: false
            properties:
                id:
