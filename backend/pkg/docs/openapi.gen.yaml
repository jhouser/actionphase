                        - "null"
            required:
                - users
                - total
                - page
                - page_size
            type: object
        UserProfile:
            additionalProperties: false
            properties:
                avatar_url:
                    type:
                        - string
                        - "null"
                bio:
                    type:
                        - string
                        - "null"
                created_at:
                    format: date-time
                    type: string
                display_name:
                    type:
                        - string
                        - "null"
                id:
                    format: int32
                    type: integer
                is_admin:
                    type: boolean
                timezone:
                    type: string
                username:
                    type: string
            required:
                - id
                - username
                - display_name
                - bio
                - avatar_url
                - created_at
                - timezone
                - is_admin
            type: object
        UserProfileResponse:
            additionalProperties: false
            properties:
                games:
                    items:
                        $ref: '#/components/schemas/UserGame'
                    type:
                        - array
                        - "null"
                metadata:
                    $ref: '#/components/schemas/UserGameHistoryMetadata'
                user:
                    $ref: '#/components/schemas/UserProfile'
            required:
                - user
                - games
                - metadata
            type: object
        UserSearchResult:
            additionalProperties: false
            properties:
                created_at:
                    type: string
                id:
                    format: int32
                    type: integer
                username:
                    type: string
            required:
                - id
                - username
                - created_at
            type: object
        ValidateResetTokenOutputBody:
            additionalProperties: false
            properties:
                valid:
                    type: boolean
            required:
                - valid
            type: object
        VerifyEmailRequest:
            additionalProperties: false
            properties:
                token:
                    type: string
            required:
                - token
            type: object
        VoterInfo:
            additionalProperties: false
            properties:
                character_name:
                    type: string
                is_anonymous:
                    type: boolean
                user_id:
                    format: int32
                    type: integer
            required:
                - user_id
                - character_name
            type: object
    securitySchemes:
        BearerAuth:
            bearerFormat: JWT
            scheme: bearer
            type: http
info:
    contact:
        name: ActionPhase Development Team
        url: https://github.com/actionphase/actionphase
    description: |
        ActionPhase is a specialized platform for running play-by-post RPG games that alternate between two distinct phases:
        - **Common Room Phase**: Asynchronous, Reddit-style threaded discussions where players interact in-character
        - **Action Phase**: Players submit private moves to the Game Master, who processes and publishes results

        This API provides access to game management, character creation, and phase management functionality.
    license:
        name: MIT
        url: https://opensource.org/licenses/MIT
    title: ActionPhase API
    version: 1.0.0
openapi: 3.0.3
paths:
    /admin/admins:
        get:
            operationId: adminListAdmins
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/User'
                                type:
                                    - array
                                    - "null"
                    description: OK
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: List all admin users
            tags:
                - Admin
    /admin/fingerprint-bans:
        get:
            operationId: adminListFingerprintBans
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FingerprintBan'
                                type:
                                    - array
                                    - "null"
                    description: OK
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: List device fingerprint bans
            tags:
                - Admin
        post:
            operationId: adminCreateFingerprintBan
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateFingerprintBanInputBody'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FingerprintBan'
                    description: Created
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: Ban a device fingerprint
            tags:
                - Admin
    /admin/fingerprint-bans/{id}:
        delete:
            operationId: adminDeleteFingerprintBan
            parameters:
                - description: Ban record ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Ban record ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: Remove a fingerprint ban
            tags:
                - Admin
    /admin/ip-bans:
        get:
            operationId: adminListIPBans
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/IPBan'
                                type:
                                    - array
                                    - "null"
                    description: OK
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: List IP bans
            tags:
                - Admin
        post:
            operationId: adminCreateIPBan
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateIPBanInputBody'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IPBan'
                    description: Created
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: Ban an IP address
            tags:
                - Admin
    /admin/ip-bans/{id}:
        delete:
            operationId: adminDeleteIPBan
            parameters:
                - description: Ban record ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Ban record ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: Remove an IP ban
            tags:
                - Admin
    /admin/messages/{messageId}:
        delete:
            operationId: adminDeleteMessage
            parameters:
                - description: Message to delete
                  in: path
                  name: messageId
                  required: true
                  schema:
                    description: Message to delete
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: Delete a message (moderation)
            tags:
                - Admin
    /admin/users:
        get:
            operationId: adminListUsers
            parameters:
                - description: Page number
                  explode: false
                  in: query
                  name: page
                  schema:
                    default: 1
                    description: Page number
                    format: int64
                    minimum: 1
                    type: integer
                - description: Results per page
                  explode: false
                  in: query
                  name: limit
                  schema:
                    default: 25
                    description: Results per page
                    format: int64
                    maximum: 100
                    minimum: 1
                    type: integer
                - description: Filter by username or email
                  explode: false
                  in: query
                  name: search
                  schema:
                    description: Filter by username or email
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserListResponse'
                    description: OK
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: List all users (paginated, searchable)
            tags:
                - Admin
    /admin/users/{id}/admin:
        delete:
            operationId: adminRevokeAdmin
            parameters:
                - description: Target user ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Target user ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: Revoke admin privileges
            tags:
                - Admin
        put:
            operationId: adminGrantAdmin
            parameters:
                - description: Target user ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Target user ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: Grant admin privileges
            tags:
                - Admin
    /admin/users/{id}/approve:
        post:
            operationId: adminApproveUser
            parameters:
                - description: Target user ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Target user ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: Approve a pending account
            tags:
                - Admin
    /admin/users/{id}/ban:
        delete:
            operationId: adminUnbanUser
            parameters:
                - description: Target user ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Target user ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: Lift a user ban
            tags:
                - Admin
        post:
            operationId: adminBanUser
            parameters:
                - description: Target user ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Target user ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: Ban a user and invalidate their sessions
            tags:
                - Admin
    /admin/users/{id}/reject:
        post:
            operationId: adminRejectUser
            parameters:
                - description: Target user ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Target user ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: Reject a pending account
            tags:
                - Admin
    /admin/users/{id}/sessions:
        get:
            operationId: adminGetUserSessions
            parameters:
                - description: Target user ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Target user ID
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/SessionWithDetails'
                                type:
                                    - array
                                    - "null"
                    description: OK
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: List a user's active sessions
            tags:
                - Admin
    /admin/users/banned:
        get:
            operationId: adminListBannedUsers
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/BannedUser'
                                type:
                                    - array
                                    - "null"
                    description: OK
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: List banned users
            tags:
                - Admin
    /admin/users/pending:
        get:
            operationId: adminListPendingUsers
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/User'
                                type:
                                    - array
                                    - "null"
                    description: OK
                "401":
                    description: Not authenticated
                "403":
                    description: Not an admin
            security:
                - BearerAuth: []
            summary: List accounts awaiting approval
            tags:
                - Admin
    /auth/account:
        delete:
            description: The account is recoverable for 30 days.
            operationId: deleteAccount
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenOnlyBody'
                    description: OK
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Soft delete the current user's account
            tags:
                - Authentication
    /auth/change-password:
        post:
            operationId: changePassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangePasswordRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageBody'
                    description: OK
                "400":
                    description: Current password wrong, or the new password is invalid
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Change the current user's password
            tags:
                - Authentication
    /auth/change-username:
        post:
            operationId: changeUsername
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangeUsernameRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageBody'
                    description: OK
                "400":
                    description: Password wrong, or the username is invalid or taken
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Change the current user's username
            tags:
                - Authentication
    /auth/complete-email-change:
        post:
            operationId: completeEmailChange
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VerifyEmailRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageBody'
                    description: OK
                "400":
                    description: Token invalid or expired
            security: []
            summary: Complete an email change using an emailed token
            tags:
                - Authentication
    /auth/discord/connect:
        get:
            operationId: getDiscordConnectURL
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenOnlyBody'
                    description: OK
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Get the Discord OAuth2 authorization URL
            tags:
                - Authentication
    /auth/discord/disconnect:
        delete:
            operationId: disconnectDiscord
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenOnlyBody'
                    description: OK
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Unlink the Discord account
            tags:
                - Authentication
    /auth/discord/status:
        get:
            operationId: getDiscordStatus
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenOnlyBody'
                    description: OK
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Check whether a Discord account is linked
            tags:
                - Authentication
    /auth/login:
        post:
            description: Authenticates with a username or email plus password, sets the jwt cookie, and returns the token. Rate limited.
            operationId: login
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenOnlyBody'
                    description: OK
                "400":
                    description: Incorrect password
                "401":
                    description: No such account, or no identifier supplied
                "403":
                    description: Account banned, pending approval, or a banned IP/device
                "429":
                    description: Too many attempts
            security: []
            summary: Log in
            tags:
                - Authentication
    /auth/logout:
        post:
            description: Clears the jwt cookie. Always succeeds with an empty body, including for a caller who was never logged in.
            operationId: logout
            responses:
                "204":
                    description: No Content
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LegacyError'
                    description: Error
            security: []
            summary: Log out
            tags:
                - Authentication
    /auth/me:
        get:
            description: 'Auth-state probe. Never returns 401: an absent, malformed or expired token yields 200 with {"user": null}, so the frontend can poll it without provoking console errors. A token whose session has been revoked also reads as signed out.'
            operationId: getCurrentUser
            responses:
                "200":
                    content:
                        application/json:
                            schema: {}
                    description: OK
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LegacyError'
                    description: Error
            security: []
            summary: Get the current user, or null when not signed in
            tags:
                - Authentication
    /auth/preferences:
        get:
            operationId: getUserPreferences
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenOnlyBody'
                    description: OK
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Get the current user's preferences
            tags:
                - Authentication
        put:
            operationId: updateUserPreferences
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePreferencesBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PreferencesBody'
                    description: OK
                "400":
                    description: Missing preferences object
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Update the current user's preferences
            tags:
                - Authentication
    /auth/refresh:
        get:
            operationId: refreshToken
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenOnlyBody'
                    description: OK
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Exchange a valid token for a fresh one
            tags:
                - Authentication
    /auth/register:
        post:
            description: Creates an account and returns a token. Responds 202 with a pending-approval notice instead when the instance requires admin approval of new accounts. Rate limited.
            operationId: register
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterBody'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema: {}
                    description: Created
                "202":
                    description: Account created and awaiting admin approval
                "400":
                    description: Validation failed, username taken, or blocked by bot prevention
                "403":
                    description: IP address or device fingerprint is banned
                "429":
                    description: Too many attempts
            security: []
            summary: Create an account
            tags:
                - Authentication
    /auth/request-email-change:
        post:
            description: Sends a confirmation link to the new address; the change only takes effect once that link is followed.
            operationId: requestEmailChange
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangeEmailRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageBody'
                    description: OK
                "400":
                    description: Password wrong, or the address is invalid or taken
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Request a change of email address
            tags:
                - Authentication
    /auth/request-password-reset:
        post:
            description: Always answers 200 with the same message whether or not the address exists, so the endpoint cannot be used to enumerate accounts. Rate limited.
            operationId: requestPasswordReset
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RequestPasswordResetRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageBody'
                    description: OK
                "429":
                    description: Too many attempts
            security: []
            summary: Request a password reset email
            tags:
                - Authentication
    /auth/resend-verification:
        post:
            operationId: resendVerificationEmail
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageBody'
                    description: OK
                "401":
                    description: Not authenticated
                "429":
                    description: Too many attempts
            security:
                - BearerAuth: []
            summary: Resend the email verification message
            tags:
                - Authentication
    /auth/reset-password:
        post:
            operationId: resetPassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResetPasswordRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageBody'
                    description: OK
                "400":
                    description: Token invalid or expired, or the passwords do not match
            security: []
            summary: Reset a password using an emailed token
            tags:
                - Authentication
    /auth/revoke-all-sessions:
        post:
            operationId: revokeAllSessions
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenOnlyBody'
                    description: OK
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Revoke every session except the current one
            tags:
                - Authentication
    /auth/sessions:
        get:
            operationId: listSessions
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenOnlyBody'
                    description: OK
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: List the current user's active sessions
            tags:
                - Authentication
    /auth/sessions/{sessionID}:
        delete:
            operationId: revokeSession
            parameters:
                - description: Session to revoke
                  in: path
                  name: sessionID
                  required: true
                  schema:
                    description: Session to revoke
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageBody'
                    description: OK
                "401":
                    description: Not authenticated
                "404":
                    description: No such session, or it belongs to another user
            security:
                - BearerAuth: []
            summary: Revoke one session
            tags:
                - Authentication
    /auth/users/search:
        get:
            operationId: searchUsers
            parameters:
                - description: Username substring to search for
                  explode: false
                  in: query
                  name: q
                  required: true
                  schema:
                    description: Username substring to search for
                    minLength: 1
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SearchUsersResponse'
                    description: OK
                "400":
                    description: Missing or empty q parameter
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Search users by username
            tags:
                - Authentication
    /auth/validate-reset-token:
        get:
            description: Lets the reset page reject an expired link before the user types a new password.
            operationId: validateResetToken
            parameters:
                - description: Reset token from the emailed link
                  explode: false
                  in: query
                  name: token
                  required: true
                  schema:
                    description: Reset token from the emailed link
                    minLength: 1
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidateResetTokenOutputBody'
                    description: OK
                "400":
                    description: Token invalid or expired
            security: []
            summary: Check a password reset token without consuming it
            tags:
                - Authentication
    /auth/verify-email:
        post:
            operationId: verifyEmail
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VerifyEmailRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageBody'
                    description: OK
                "400":
                    description: Token invalid or expired
            security: []
            summary: Verify an email address using an emailed token
            tags:
                - Authentication
    /characters/{id}:
        delete:
            description: Deletes a character that has never spoken or acted. GM only.
            operationId: deleteCharacter
            parameters:
                - description: Character ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Character ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "400":
                    description: Character has messages or action submissions
                "401":
                    description: Not authenticated
                "403":
                    description: Only the GM can delete characters
                "404":
                    description: Character not found
            security:
                - BearerAuth: []
            summary: Delete a character
            tags:
                - Characters
        get:
            description: Returns one character. In a running game another player's unapproved character is reported as not found, and an anonymous game omits character_type.
            operationId: getCharacter
            parameters:
                - description: Character ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Character ID
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CharacterResponse'
                    description: OK
                "401":
                    description: Not authenticated
                "404":
                    description: Character hidden from the caller (another player's unapproved character in a running game)
                "500":
                    description: No such character. A missing id is reported as a server error, not a 404 -- carried over from the chi handler; see http-status-codes.md
            security:
                - BearerAuth: []
            summary: Get a character
            tags:
                - Characters
    /characters/{id}/approve:
        post:
            description: 'Approves a pending character and notifies its owner. GM only. There is no reject path: the database allows only pending and approved.'
            operationId: approveCharacter
            parameters:
                - description: Character ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Character ID
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApproveCharacterRequest'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CharacterResponse'
                    description: OK
                "400":
                    description: status was not "approved"
                "401":
                    description: Not authenticated
                "403":
                    description: Only the GM can approve characters
                "500":
                    description: No such character (see the note on getCharacter)
            security:
                - BearerAuth: []
            summary: Approve a character
            tags:
                - Characters
    /characters/{id}/assign:
        post:
            description: Hands control of an NPC to an audience member, or back to the GM. GM only.
            operationId: assignNPC
            parameters:
                - description: Character ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Character ID
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AssignNPCRequest'
            responses:
                "204":
                    description: No Content
                "400":
                    description: Target user is not an audience member
                "401":
                    description: Not authenticated
                "403":
                    description: Only the GM can assign NPCs
                "500":
                    description: No such character (see the note on getCharacter)
            security:
                - BearerAuth: []
            summary: Assign an NPC to a user
            tags:
                - Characters
    /characters/{id}/avatar:
        delete:
            operationId: deleteCharacterAvatar
            parameters:
                - description: Character ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Character ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    description: Not authenticated
                "403":
                    description: Not permitted to modify this character
            security:
                - BearerAuth: []
            summary: Delete a character avatar
            tags:
                - Characters
        post:
            description: Accepts multipart/form-data with an `avatar` file field. JPG, PNG and WebP are allowed, up to 5MB.
            operationId: uploadCharacterAvatar
            parameters:
                - description: Character ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Character ID
                    format: int32
                    type: integer
            requestBody:
                content:
                    multipart/form-data:
                        encoding:
                            avatar:
                                contentType: application/octet-stream
                        schema:
                            properties:
                                avatar:
                                    contentEncoding: binary
                                    contentMediaType: application/octet-stream
                                    description: Avatar image — JPG, PNG or WebP, max 5MB
                                    format: binary
                                    type: string
                            required:
                                - avatar
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AvatarUploadResponse'
                    description: OK
                "400":
                    description: Missing, oversized, or unsupported image
                "401":
                    description: Not authenticated
                "403":
                    description: Not permitted to modify this character
            security:
                - BearerAuth: []
            summary: Upload a character avatar
            tags:
                - Characters
    /characters/{id}/comments:
        get:
            description: Returns the character's public activity, each comment carrying the message it replies to.
            operationId: listCharacterComments
            parameters:
                - description: Character ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Character ID
                    format: int32
                    type: integer
                - description: Messages to return; values above 50 are clamped to 50
                  explode: false
                  in: query
                  name: limit
                  schema:
                    default: 20
                    description: Messages to return; values above 50 are clamped to 50
                    format: int32
                    minimum: 1
                    type: integer
                - description: Messages to skip
                  explode: false
                  in: query
                  name: offset
                  schema:
                    default: 0
                    description: Messages to skip
                    format: int32
                    minimum: 0
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CharacterMessagesResponse'
                    description: OK
                "400":
                    description: Invalid limit or offset
                "401":
                    description: Not authenticated
                "404":
                    description: Character not found
            security:
                - BearerAuth: []
            summary: List a character's posts and comments
            tags:
                - Common Room
    /characters/{id}/data:
        get:
            description: Returns the character sheet. Private fields are included only for editors, audience members, and every participant once the game is a public archive.
            operationId: getCharacterData
            parameters:
                - description: Character ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Character ID
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CharacterDataResponse'
                                type:
                                    - array
                                    - "null"
                    description: OK
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Get a character's sheet fields
            tags:
                - Characters
        post:
            description: Writes one field of the character sheet. Stat modules (skills, inventory, numbers) are GM-only.
            operationId: setCharacterData
            parameters:
                - description: Character ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Character ID
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CharacterDataRequest'
            responses:
                "204":
                    description: No Content
                "400":
                    description: Invalid body
                "401":
                    description: Not authenticated
                "403":
                    description: Not allowed to edit this character, or this module
            security:
                - BearerAuth: []
            summary: Set a character sheet field
            tags:
                - Characters
    /characters/{id}/reassign:
        put:
            description: Gives an inactive character a new owner. GM only, and only while the character is inactive.
            operationId: reassignCharacter
            parameters:
                - description: Character ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Character ID
                    format: int32
