                - Audience
    /games/{gameID}/banner:
        delete:
            description: Clears the game's banner image. Primary GM only.
            operationId: deleteGameBanner
            parameters:
                - description: Game ID
                  in: path
                  name: gameID
                  required: true
                  schema:
                    description: Game ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    description: Not authenticated
                "403":
                    description: Only the GM can remove the game banner
            security:
                - BearerAuth: []
            summary: Remove a game banner
            tags:
                - Games
        post:
            description: Replaces the game's banner image. JPG, PNG or WebP, at most 5MB. Primary GM only.
            operationId: uploadGameBanner
            parameters:
                - description: Game ID
                  in: path
                  name: gameID
                  required: true
                  schema:
                    description: Game ID
                    format: int32
                    type: integer
            requestBody:
                content:
                    multipart/form-data:
                        encoding:
                            banner:
                                contentType: application/octet-stream
                        schema:
                            properties:
                                banner:
                                    contentEncoding: binary
                                    contentMediaType: application/octet-stream
                                    description: 'Banner image: JPG, PNG or WebP, at most 5MB'
                                    format: binary
                                    type: string
                            required:
                                - banner
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BannerOutputBody'
