                - description: Application ID
                  in: path
                  name: applicationId
                  required: true
                  schema:
                    description: Application ID
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReviewApplicationBody'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GameApplicationResponse'
                    description: OK
                "400":
                    description: Invalid action, or the application belongs to another game
                "401":
                    description: Not authenticated
                "403":
                    description: Only the GM can review game applications
            security:
                - BearerAuth: []
