    /games/{gameID}/comments/recent:
        get:
            description: Backs the New Comments view. Each entry carries the message it replies to, so the list renders context without a request per row.
            operationId: listRecentComments
            parameters:
                - description: Game ID
                  in: path
                  name: gameID
                  required: true
                  schema:
                    description: Game ID
                    format: int32
                    type: integer
                - description: Comments to return; values above 50 are clamped to 50
                  explode: false
                  in: query
                  name: limit
                  schema:
                    default: 10
                    description: Comments to return; values above 50 are clamped to 50
                    format: int32
                    minimum: 1
                    type: integer
                - description: Comments to skip
                  explode: false
                  in: query
                  name: offset
                  schema:
                    default: 0
                    description: Comments to skip
                    format: int32
                    minimum: 0
                    type: integer
                - description: Return only comments the caller has not marked read
                  explode: false
                  in: query
                  name: unread_only
                  schema:
                    description: Return only comments the caller has not marked read
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecentCommentsResponse'
                    description: OK
                "400":
                    description: Invalid limit or offset
                "401":
                    description: Not authenticated, or unread_only used anonymously
