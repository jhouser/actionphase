                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeletedResponse'
                    description: OK
                "401":
                    description: Not authenticated
                "403":
                    description: Not the GM or co-GM
                "404":
                    description: Phase has no draft post
            security:
                - BearerAuth: []
            summary: Delete a phase's draft post
            tags:
                - Common Room
        get:
            description: Returns the phase's unpublished draft. A phase with no draft answers 200 with a null body, not 404. GM and co-GM only.
            operationId: getDraftPost
            parameters:
                - description: Phase ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Phase ID
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageResponse'
                    description: OK
                "401":
                    description: Not authenticated
                "403":
                    description: Not the GM or co-GM
                "404":
                    description: Phase not found
            security:
                - BearerAuth: []
            summary: Get a phase's draft post
            tags:
                - Common Room
        post:
            description: Starts a draft for a phase. One draft per phase. GM and co-GM only.
            operationId: createDraftPost
            parameters:
                - description: Phase ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Phase ID
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateDraftPostRequest'
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageResponse'
                    description: Created
                "400":
                    description: Invalid request body
                "401":
                    description: Not authenticated
                "403":
                    description: Not the GM or co-GM
                "404":
                    description: Phase not found
                "409":
                    description: A draft already exists for this phase, or the game is archived
            security:
                - BearerAuth: []
            summary: Create a phase's draft post
            tags:
                - Common Room
        put:
            description: Rewrites the draft's content. GM and co-GM only.
            operationId: updateDraftPost
            parameters:
                - description: Phase ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Phase ID
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateDraftPostRequest'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MessageResponse'
                    description: OK
                "400":
                    description: Invalid request body
                "401":
                    description: Not authenticated
                "403":
                    description: Not the GM or co-GM
                "404":
                    description: Phase has no draft post
            security:
                - BearerAuth: []
            summary: Replace a phase's draft post
            tags:
                - Common Room
    /ping:
        get:
            description: |
                Simple health check to verify the API is running. Served at the root
                (`/ping`), not under the `/api/v1` base used by every other operation.
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                example: ponger
                                type: string
                    description: API is healthy
                "503":
                    description: API is unavailable
            security: []
            servers:
                - description: Local development server (root, not /api/v1)
                  url: http://localhost:3000
                - description: Production server (root, not /api/v1)
                  url: https://api.action-phase.com
            summary: Health check endpoint
            tags:
                - Health
    /polls/{pollId}:
        delete:
            operationId: deletePoll
            parameters:
                - description: Poll ID
                  in: path
                  name: pollId
                  required: true
                  schema:
                    description: Poll ID
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LegacyError'
                    description: Error
            summary: Delete a poll
            tags:
                - Polls
        get:
            operationId: getPoll
            parameters:
                - description: Poll ID
                  in: path
                  name: pollId
                  required: true
                  schema:
                    description: Poll ID
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PollResponse'
                    description: OK
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LegacyError'
                    description: Error
            summary: Get a poll
            tags:
                - Polls
        put:
            operationId: updatePoll
            parameters:
                - description: Poll ID
                  in: path
                  name: pollId
                  required: true
                  schema:
                    description: Poll ID
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePollRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PollResponse'
                    description: OK
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LegacyError'
                    description: Error
            summary: Update a poll
            tags:
                - Polls
    /polls/{pollId}/results:
        get:
            description: Results are withheld from players while voting is open, and entirely when the GM set hide_results_from_players.
            operationId: getPollResults
            parameters:
                - description: Poll ID
                  in: path
                  name: pollId
                  required: true
                  schema:
                    description: Poll ID
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PollResultsResponse'
                    description: OK
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LegacyError'
                    description: Error
            summary: Get poll results
            tags:
                - Polls
    /polls/{pollId}/vote:
        post:
            operationId: submitVote
            parameters:
                - description: Poll ID
                  in: path
                  name: pollId
                  required: true
                  schema:
                    description: Poll ID
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubmitVoteRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PollVote'
                    description: OK
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LegacyError'
                    description: Error
            summary: Submit a vote
            tags:
                - Polls
    /users/{id}/profile:
        get:
            description: Public to any authenticated user. Includes a paginated game history.
            operationId: getUserProfile
            parameters:
                - description: User ID
                  in: path
                  name: id
                  required: true
                  schema:
                    description: User ID
                    format: int32
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserProfileResponse'
                    description: OK
                "401":
                    description: Not authenticated
                "404":
                    description: User profile not found
            security:
                - BearerAuth: []
            summary: Get a user's profile by ID
            tags:
                - Users
    /users/me/avatar:
        delete:
            operationId: deleteOwnAvatar
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteUserAvatarOutputBody'
                    description: OK
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Delete your own avatar
            tags:
                - Users
        post:
            description: multipart/form-data with an `avatar` file field. JPG, PNG or WebP, max 5MB.
            operationId: uploadOwnAvatar
            requestBody:
                content:
                    multipart/form-data:
                        encoding:
                            avatar:
                                contentType: application/octet-stream
                        schema:
                            properties:
                                avatar:
                                    contentEncoding: binary
                                    contentMediaType: application/octet-stream
                                    description: Avatar image — JPG, PNG or WebP, max 5MB
                                    format: binary
                                    type: string
                            required:
                                - avatar
                            type: object
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UploadAvatarResponse'
                    description: Created
                "400":
                    description: Missing, oversized, or unsupported image
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Upload your own avatar
            tags:
                - Users
    /users/me/profile:
        patch:
            description: Both fields are optional; sending an empty string clears one.
            operationId: updateOwnProfile
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateProfileBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserProfileResponse'
                    description: OK
                "401":
                    description: Not authenticated
            security:
                - BearerAuth: []
            summary: Update your own profile
            tags:
                - Users
    /users/username/{username}/profile:
        get:
            description: Public to any authenticated user. Includes a paginated game history.
            operationId: getUserProfileByUsername
            parameters:
                - description: Username
                  in: path
                  name: username
                  required: true
                  schema:
                    description: Username
                    minLength: 1
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserProfileResponse'
                    description: OK
                "401":
                    description: Not authenticated
                "404":
                    description: User not found
            security:
                - BearerAuth: []
            summary: Get a user's profile by username
            tags:
                - Users
security:
    - BearerAuth: []
