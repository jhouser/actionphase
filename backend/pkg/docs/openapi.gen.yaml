    /games/{gameID}/posts/{postId}/comments-with-threads:
        get:
            description: Pages over top-level comments and returns their nested replies alongside them, each annotated with its depth. Paging is measured in top-level comments, so a page holds more rows than its limit.
            operationId: listPostCommentsWithThreads
            parameters:
                - description: Game ID
                  in: path
                  name: gameID
                  required: true
                  schema:
                    description: Game ID
                    format: int32
                    type: integer
                - description: Post ID
                  in: path
                  name: postId
                  required: true
                  schema:
                    description: Post ID
                    format: int32
                    type: integer
                - description: Top-level comments to return
                  explode: false
                  in: query
                  name: limit
                  schema:
                    default: 5
                    description: Top-level comments to return
                    format: int32
                    maximum: 500
                    minimum: 1
                    type: integer
                - description: Top-level comments to skip
                  explode: false
                  in: query
                  name: offset
                  schema:
                    default: 0
                    description: Top-level comments to skip
                    format: int32
                    minimum: 0
                    type: integer
                - description: Deepest reply level to include, 0-10. Defaults to the server's configured comment depth.
                  explode: false
                  in: query
                  name: max_depth
                  schema:
                    default: -1
                    description: Deepest reply level to include, 0-10. Defaults to the server's configured comment depth.
