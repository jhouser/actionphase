            tags:
                - Game Applications
    /games/{gameID}/apply:
        post:
            description: Applies to join as a player or audience member. Requires a verified email address. An audience application is accepted immediately when the game allows it.
            operationId: applyToGame
            parameters:
                - description: Game ID
                  in: path
                  name: gameID
                  required: true
                  schema:
                    description: Game ID
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApplyToGameBody'
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GameApplicationResponse'
                    description: Created
                "400":
