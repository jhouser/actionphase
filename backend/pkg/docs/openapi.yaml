openapi: 3.0.3
info:
  title: ActionPhase API
  description: |
    ActionPhase is a specialized platform for running play-by-post RPG games that alternate between two distinct phases:
    - **Common Room Phase**: Asynchronous, Reddit-style threaded discussions where players interact in-character
    - **Action Phase**: Players submit private moves to the Game Master, who processes and publishes results

    This API provides access to game management, character creation, and phase management functionality.
  version: 1.0.0
  contact:
    name: ActionPhase Development Team
    url: https://github.com/actionphase/actionphase
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
  - url: https://api.action-phase.com/api/v1
    description: Production server

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Error Response Schema
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          description: User-friendly status message
          example: "Bad request."
        code:
          type: integer
          format: int64
          description: Application-specific error code
          example: 1001
        error:
          type: string
          description: Detailed error message for debugging
          example: "username already exists"
      required:
        - status

    # User Schemas
    User:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 123
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: "gamemaster_alex"
        email:
          type: string
          format: email
          example: "alex@example.com"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - username
        - email

    # Game Schemas
    Game:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 456
        title:
          type: string
          minLength: 3
          maxLength: 255
          example: "The Chronicles of Eldoria"
        description:
          type: string
          minLength: 10
          example: "A high-fantasy RPG campaign set in the mystical realm of Eldoria"
        gm_user_id:
          type: integer
          format: int32
          example: 123
        state:
          type: string
          enum: [setup, recruitment, character_creation, in_progress, paused, completed, cancelled]
          example: "recruitment"
        genre:
          type: string
          example: "Fantasy RPG"
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        recruitment_deadline:
          type: string
          format: date-time
          nullable: true
        max_players:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
          example: 6
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - gm_user_id
        - state

    GameWithDetails:
      allOf:
        - $ref: '#/components/schemas/Game'
        - type: object
          properties:
            current_players:
              type: integer
              format: int64
              example: 4
            gm_username:
              type: string
              example: "gamemaster_alex"
            is_public:
              type: boolean
              example: true

    CreateGameRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 255
          example: "The Chronicles of Eldoria"
        description:
          type: string
          minLength: 10
          example: "A high-fantasy RPG campaign set in the mystical realm of Eldoria"
        genre:
          type: string
          example: "Fantasy RPG"
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        recruitment_deadline:
          type: string
          format: date-time
          nullable: true
        max_players:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
          example: 6
        character_sheet:
          $ref: '#/components/schemas/CharacterSheetConfig'
      required:
        - title
        - description

    CharacterSheetConfig:
      type: object
      description: >-
        Per-game character sheet overrides. Sparse: a key is present only when the GM
        has actually overridden it, and an absent key means "use the default". Defaults
        are owned by the frontend and are never filled in by the server.


        Replace semantics, not merge. `PUT /games/{gameID}` is a full replace, so a
        request that omits `character_sheet` RESETS every label to its default -- this
        is how a GM unsets a renamed tab. Likewise, supplying a config with only
        `skills` clears any previously stored `inventory` and `numbers` labels.


        Unknown keys are rejected with 400.
      properties:
        labels:
          type: object
          description: >-
            GM overrides for the stat tab names. Each key is the tab's storage
            module_type. Values are trimmed; a whitespace-only value is treated as
            no override. Max 24 characters (counted in runes); control characters and
            newlines are rejected.
          properties:
            skills:
              type: string
              maxLength: 24
              example: "Approaches"
            inventory:
              type: string
              maxLength: 24
              example: "Gear"
            numbers:
              type: string
              maxLength: 24
              example: "Stress"
          additionalProperties: false
      additionalProperties: false

    UpdateGameRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          minLength: 10
        genre:
          type: string
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        recruitment_deadline:
          type: string
          format: date-time
          nullable: true
        max_players:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
        is_public:
          type: boolean
        character_sheet:
          $ref: '#/components/schemas/CharacterSheetConfig'

    UpdateGameStateRequest:
      type: object
      properties:
        state:
          type: string
          enum: [setup, recruitment, character_creation, in_progress, paused, completed, cancelled]
          example: "in_progress"
      required:
        - state

    GameParticipant:
      type: object
      properties:
        user_id:
          type: integer
          format: int32
        username:
          type: string
        role:
          type: string
          enum: [player, audience, gm]
          example: "player"
        joined_at:
          type: string
          format: date-time

    # Game Application Schemas
    GameApplication:
      type: object
      properties:
        id:
          type: integer
          format: int32
        game_id:
          type: integer
          format: int32
        user_id:
          type: integer
          format: int32
        username:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        created_at:
          type: string
          format: date-time

    ApplyToGameRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 10
          example: "I'm an experienced player looking to join a fantasy campaign"
      required:
        - message

    ReviewApplicationRequest:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected]
        response_message:
          type: string
          nullable: true
      required:
        - status






    # Phase Schemas
    Action:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 201
        game_id:
          type: integer
          format: int32
          example: 456
        user_id:
          type: integer
          format: int32
          example: 123
        phase_id:
          type: integer
          format: int32
          example: 101
        character_id:
          type: integer
          format: int32
          nullable: true
          example: 789
        content:
          type: string
          example: "I search the ancient library for clues about the artifact"
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - game_id
        - user_id
        - phase_id
        - content

    ActionResult:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 301
        game_id:
          type: integer
          format: int32
          example: 456
        user_id:
          type: integer
          format: int32
          example: 123
          description: The player receiving this result
        phase_id:
          type: integer
          format: int32
          example: 101
        character_id:
          type: integer
          format: int32
          nullable: true
          example: 789
        action_submission_id:
          type: integer
          format: int32
          nullable: true
          example: 201
          description: Reference to the original action submission
        gm_user_id:
          type: integer
          format: int32
          example: 100
          description: The GM who created this result
        content:
          type: string
          example: "You discover an ancient tome with cryptic symbols"
        is_published:
          type: boolean
          example: true
          description: Whether this result has been published to the player
        sent_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - game_id
        - user_id
        - phase_id
        - gm_user_id
        - content
        - is_published

    SessionInfo:
      type: object
      properties:
        id:
          type: string
          example: "sess_abc123def456"
          description: Session identifier
        device_info:
          type: string
          nullable: true
          example: "Chrome 120.0 on macOS"
          description: Browser and OS information
        ip_address:
          type: string
          example: "192.168.1.1"
          description: IP address from which session was created
        last_active:
          type: string
          format: date-time
          description: Last time this session was used
        is_current:
          type: boolean
          example: true
          description: Whether this is the current session
        created_at:
          type: string
          format: date-time
      required:
        - id
        - last_active
        - is_current

    # Password Reset Schemas
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "player@example.com"
      required:
        - email

    PasswordResetConfirm:
      type: object
      properties:
        token:
          type: string
          example: "reset_token_abc123xyz789"
          description: Password reset token from email
        new_password:
          type: string
          minLength: 8
          example: "new_secure_password123"
          description: New password (minimum 8 characters)
      required:
        - token
        - new_password

    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          example: "old_password123"
          description: Current password for verification
        new_password:
          type: string
          minLength: 8
          example: "new_secure_password123"
          description: New password (minimum 8 characters)
      required:
        - current_password
        - new_password

    TokenValidation:
      type: object
      properties:
        valid:
          type: boolean
          example: true
          description: Whether the reset token is valid
        message:
          type: string
          example: "Token is valid"
          description: Human-readable validation message
      required:
        - valid
        - message

    # Notification Schemas
    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 501
        user_id:
          type: integer
          format: int32
          example: 123
        type:
          type: string
          enum: [game_invite, character_approved, phase_started, action_result_published, new_post, new_comment, deadline_reminder]
          example: "character_approved"
          description: |
            Notification types:
            - game_invite: Invited to join a game
            - character_approved: Character approved by GM
            - phase_started: New game phase has started
            - action_result_published: GM published action results
            - new_post: New post in common room
            - new_comment: Comment on your post or mention
            - deadline_reminder: Action phase deadline approaching
        title:
          type: string
          example: "Character Approved"
          description: Short notification title
        message:
          type: string
          example: "Your character 'Elara Moonwhisper' has been approved by the Game Master"
          description: Notification message body
        link:
          type: string
          nullable: true
          example: "/games/456/characters/789"
          description: Optional link to related resource
        read:
          type: boolean
          example: false
          description: Whether notification has been read
        created_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - type
        - title
        - message
        - read

    NotificationList:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        total:
          type: integer
          format: int64
          example: 42
          description: Total number of notifications
        page:
          type: integer
          format: int32
          example: 1
          description: Current page number
        page_size:
          type: integer
          format: int32
          example: 20
          description: Number of items per page
        has_more:
          type: boolean
          example: true
          description: Whether more pages are available
      required:
        - notifications
        - total
        - page
        - page_size
        - has_more

    UnreadCount:
      type: object
      properties:
        count:
          type: integer
          format: int64
          example: 5
          description: Number of unread notifications
      required:
        - count

    # Dashboard Schemas
    Deadline:
      type: object
      properties:
        game_id:
          type: integer
          format: int32
          example: 456
        game_title:
          type: string
          example: "The Chronicles of Eldoria"
        phase_id:
          type: integer
          format: int32
          example: 101
        phase_number:
          type: integer
          format: int32
          example: 1
        deadline:
          type: string
          format: date-time
          description: When the deadline occurs
        time_remaining:
          type: integer
          format: int64
          description: Seconds until deadline
      required:
        - game_id
        - game_title
        - phase_id
        - phase_number
        - deadline
        - time_remaining

    DashboardData:
      type: object
      properties:
        active_games:
          type: array
          items:
            $ref: '#/components/schemas/Game'
          description: Games the user is currently playing
        recruiting_games:
          type: array
          items:
            $ref: '#/components/schemas/Game'
          description: Games open for recruitment
        recent_notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
          description: Last 5 notifications
        unread_count:
          type: integer
          format: int64
          example: 3
          description: Total unread notification count
        my_pending_actions:
          type: integer
          format: int64
          example: 2
          description: Number of action submissions needed
        upcoming_deadlines:
          type: array
          items:
            $ref: '#/components/schemas/Deadline'
          description: Next 3 approaching deadlines
      required:
        - active_games
        - recruiting_games
        - recent_notifications
        - unread_count
        - my_pending_actions
        - upcoming_deadlines

    GameLog:
      type: object
      properties:
        id:
          type: integer
          format: int32
        game_id:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time

paths:
  # Health Check
  #
  # Registered on the root router, NOT under /api/v1 (see root.go). The
  # per-operation `servers` override below is what makes the documented URL
  # match reality — without it this resolves to /api/v1/ping, which 404s.
  /ping:
    get:
      servers:
        - url: http://localhost:3000
          description: Local development server (root, not /api/v1)
        - url: https://api.action-phase.com
          description: Production server (root, not /api/v1)
      tags:
        - Health
      summary: Health check endpoint
      description: |
        Simple health check to verify the API is running. Served at the root
        (`/ping`), not under the `/api/v1` base used by every other operation.
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            text/plain:
              schema:
                type: string
                example: "ponger"
        '503':
          description: API is unavailable

  # Game Management Endpoints
  #
  # NOTE: there is no /games/public endpoint. It was documented here for some
  # time with no handler behind it; requests returned 401 (auth middleware runs
  # before routing) rather than 404, which disguised the cause. Use
  # /games/recruiting below, or /games for the full authenticated listing.
  /games/recruiting:
    get:
      tags:
        - Games
      summary: Get games currently recruiting
      description: Retrieve games that are actively recruiting new players
      responses:
        '200':
          description: List of recruiting games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'

  /games:
    post:
      tags:
        - Games
      summary: Create a new game
      description: Create a new RPG game. Only authenticated users can create games.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Game created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games/{id}:
    get:
      tags:
        - Games
      summary: Get game by ID
      description: Retrieve detailed information about a specific game
      parameters:
        - name: id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Game details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Games
      summary: Update game
      description: Update game information. Only the game master can update their games.
      parameters:
        - name: id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameRequest'
      responses:
        '200':
          description: Game updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only game master can update game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Games
      summary: Delete game
      description: Delete a game. Only the game master can delete their games.
      parameters:
        - name: id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Game deleted successfully
        '403':
          description: Only game master can delete game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games/{id}/details:
    get:
      tags:
        - Games
      summary: Get game with detailed information
      description: Retrieve comprehensive game information including participant count and GM details
      parameters:
        - name: id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Game details with additional information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameWithDetails'

  /games/{id}/state:
    put:
      tags:
        - Games
      summary: Update game state
      description: Change the game's current state (e.g., from recruitment to in_progress)
      parameters:
        - name: id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameStateRequest'
      responses:
        '200':
          description: Game state updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Only game master can update game state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games/{id}/participants:
    get:
      tags:
        - Games
      summary: Get game participants
      description: Retrieve list of all participants in the game
      parameters:
        - name: id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: List of game participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameParticipant'

  /games/{id}/leave:
    delete:
      tags:
        - Games
      summary: Leave game
      description: Remove yourself from a game you're participating in
      parameters:
        - name: id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Successfully left the game
        '400':
          description: Cannot leave game (e.g., game master, game in progress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Game Application Endpoints
  /games/{id}/apply:
    post:
      tags:
        - Game Applications
      summary: Apply to join game
      description: Submit an application to join a game during recruitment phase
      parameters:
        - name: id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyToGameRequest'
      responses:
        '201':
          description: Application submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameApplication'
        '400':
          description: Invalid application or game not accepting applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games/{id}/applications:
    get:
      tags:
        - Game Applications
      summary: Get game applications
      description: Get all applications for a game (GM only)
      parameters:
        - name: id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameApplication'
        '403':
          description: Only game master can view applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games/{id}/applications/{applicationId}/review:
    put:
      tags:
        - Game Applications
      summary: Review application
      description: Approve or reject a game application (GM only)
      parameters:
        - name: id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
        - name: applicationId
          in: path
          required: true
          description: Application ID
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewApplicationRequest'
      responses:
        '200':
          description: Application reviewed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameApplication'
        '403':
          description: Only game master can review applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games/{id}/application:
    delete:
      tags:
        - Game Applications
      summary: Withdraw application
      description: Withdraw your pending application to join a game
      parameters:
        - name: id
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Application withdrawn successfully
        '404':
          description: No pending application found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'








  /games/{gameId}/logs:
    get:
      tags:
        - Game Logs
      summary: Get game logs
      description: Get all logs for a game (GM only while the game is running)
      parameters:
        - name: gameId
          in: path
          required: true
          description: Game ID
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: List of logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameLog'
        '403':
          description: Only game master can view logs while the game is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

