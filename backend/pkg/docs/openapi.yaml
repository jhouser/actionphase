openapi: 3.0.3
info:
  title: ActionPhase API
  description: |
    ActionPhase is a specialized platform for running play-by-post RPG games that alternate between two distinct phases:
    - **Common Room Phase**: Asynchronous, Reddit-style threaded discussions where players interact in-character
    - **Action Phase**: Players submit private moves to the Game Master, who processes and publishes results

    This API provides access to game management, character creation, and phase management functionality.
  version: 1.0.0
  contact:
    name: ActionPhase Development Team
    url: https://github.com/actionphase/actionphase
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
  - url: https://api.action-phase.com/api/v1
    description: Production server

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  # Health Check
  #
  # Registered on the root router, NOT under /api/v1 (see root.go). The
  # per-operation `servers` override below is what makes the documented URL
  # match reality — without it this resolves to /api/v1/ping, which 404s.
  /ping:
    get:
      servers:
        - url: http://localhost:3000
          description: Local development server (root, not /api/v1)
        - url: https://api.action-phase.com
          description: Production server (root, not /api/v1)
      tags:
        - Health
      summary: Health check endpoint
      description: |
        Simple health check to verify the API is running. Served at the root
        (`/ping`), not under the `/api/v1` base used by every other operation.
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            text/plain:
              schema:
                type: string
                example: "ponger"
        '503':
          description: API is unavailable

  # Game Management Endpoints
  #
  # NOTE: there is no /games/public endpoint. It was documented here for some
  # time with no handler behind it; requests returned 401 (auth middleware runs
  # before routing) rather than 404, which disguised the cause. Use
  # /games/recruiting below, or /games for the full authenticated listing.
tags:
  - name: Health
    description: API health and status endpoints
  - name: Authentication
    description: User authentication and session management
  - name: Games
    description: Game creation, management, and participation
  - name: Game Applications
    description: Application system for joining games
  - name: Game Logs
    description: Game logs to view the game timeline
  - name: Characters
    description: Character creation, management, and character sheet data
  - name: Phases
    description: Game phase management (action and common room phases)
  - name: Actions
    description: Player action submission during action phases
  - name: Action Results
    description: GM responses to player actions
  - name: Common Room
    description: Threaded discussion posts and comments in the common room
  - name: Notifications
    description: User notification system for game events and updates
  - name: Dashboard
    description: Aggregated dashboard data for user overview
  - name: Handouts
    description: Game reference documents and lore provided by Game Masters
